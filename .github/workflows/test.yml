name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # `make test` runs bats (smoke tests) and pytest test/py in the Alpine test image.
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test

  # pytest on the runner's default Python 3 (the main suite).
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install pytest
      - run: python -m pytest -q -p no:cacheprovider test/py

  bats-bash32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test-bash32

  tests-py311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test-py311
