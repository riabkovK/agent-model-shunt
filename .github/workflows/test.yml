name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test

  bats-bash32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test-bash32

  tests-py311:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make test-py311
